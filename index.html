<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>記帳道場</title>
<meta name="description" content="マネーフォワード クラウド会計で記帳するための考え方を、ステージ制で身につけるレベルチェック">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+JP:wght@400;700;900&display=swap" rel="stylesheet">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 64 64%27%3E%3Crect width=%2764%27 height=%2764%27 rx=%2714%27 fill=%27%231f5fbf%27/%3E%3Ctext x=%2732%27 y=%2744%27 font-size=%2734%27 text-anchor=%27middle%27 fill=%27%23fff%27 font-weight=%27700%27%3E帳%3C/text%3E%3C/svg%3E">
<link rel="stylesheet" href="css/app.css">
</head>
<body>
<div class="app">
  <header class="top">
    <button class="brand" data-go="home" type="button"><span class="mark">帳</span>記帳道場</button>
    <div class="who"><span id="who-name"></span><button id="who-change" type="button">名前</button><button id="who-reset" type="button">リセット</button></div>
  </header>

  <!-- 名前 -->
  <section id="name" class="view">
    <div class="card">
      <h1>記帳道場へようこそ</h1>
      <p class="muted">マネーフォワード クラウド会計で記帳するための「考え方」を、7つの章・29のステージで身につけます。各ステージは正答率80%でクリア。前のステージをクリアすると次が開きます。</p>
      <form id="name-form" class="row" style="margin-top:12px">
        <input class="text" id="name-input" placeholder="お名前（記録に使います）" autocomplete="name" required>
        <button class="btn block" type="submit">はじめる</button>
      </form>
      <p class="muted" style="margin-top:10px">進捗はこの端末に保存され、ステージを終えるたびに指導者のスプレッドシートへも記録されます。</p>
    </div>
  </section>

  <!-- ホーム -->
  <section id="home" class="view">
    <div class="card hero">
      <svg class="ring" viewBox="0 0 100 100" aria-hidden="true"><circle class="track" cx="50" cy="50" r="42"/><circle class="bar" id="ring-bar" cx="50" cy="50" r="42"/><text id="ring-text" x="50" y="57" text-anchor="middle">0%</text></svg>
      <div><h1 style="margin:0">ワールドマップ</h1><div class="muted" id="home-sub"></div><div class="muted" id="queue-note" style="font-size:12px"></div></div>
    </div>
    <div class="map" id="map"></div>
    <p class="muted" style="font-size:13px">● クリア済み　◎ 挑戦できる　○ まだ開いていない　■ ボス</p>
  </section>

  <!-- 章 -->
  <section id="chapter" class="view">
    <div class="row" style="margin:8px 0"><button class="btn secondary" data-go="home" type="button">← マップ</button></div>
    <div class="card">
      <h1 id="ch-title"></h1>
      <p id="ch-goal" class="muted"></p>
      <div id="ch-diagram"></div>
    </div>
    <h3>ステージ</h3>
    <div class="stages" id="stages"></div>
  </section>

  <!-- ステージ -->
  <section id="stage" class="view">
    <div class="row" style="margin:8px 0"><button class="btn secondary" id="st-back" type="button">← 章へ</button><span class="sp"></span><span class="muted" id="st-aim" style="font-size:12px"></span></div>
    <details class="card dia" id="st-dia"><summary>図解を見る：<span id="st-dia-title"></span></summary><div id="st-diagram"></div></details>
    <div class="card">
      <h2 id="st-title"></h2>
      <div class="qmeta" id="q-meta"></div>
      <div class="progress"><i id="q-progress" style="width:0"></i></div>
      <div id="q-body"></div>
      <div id="q-fb"></div>
      <button class="btn block" id="q-next" type="button" style="display:none">次の問題へ</button>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="view">
    <div class="card" style="text-align:center">
      <h1 id="r-title"></h1>
      <div class="big" id="r-big"></div>
      <div class="muted" id="r-sub"></div>
      <div id="r-badge"></div>
      <div id="r-weak" style="margin:10px 0"></div>
      <div class="row" style="justify-content:center;margin-top:12px">
        <button class="btn ok" id="r-next" type="button">次のステージへ →</button>
        <button class="btn" id="r-retry" type="button">もう一度</button>
        <button class="btn secondary" id="r-chapter" type="button">章に戻る</button>
      </div>
      <p class="muted" style="font-size:12px;margin-top:14px"><span id="r-send"></span> <button class="d-btn" id="r-resend" type="button">再送</button></p>
    </div>
  </section>

  <footer><span id="ver"></span>　出典：会計監査ルール（全社共通）・仕訳ナレッジ共通ルール</footer>
</div>
<div class="toast" id="toast"></div>

<script>window.GAS_URL = "https://script.google.com/macros/s/AKfycbxeHMXOCjEd1-VPHxlM3yyty6kzxCYo2NmnRS3sBOj0piYlnOSu66i6Lpg7Yr9HceaE/exec";</script>
<script src="data/curriculum.js"></script>
<script src="data/questions.js"></script>
<script src="js/diagrams.js"></script>
<script src="js/store.js"></script>
<script src="js/sheet.js"></script>
<script src="js/app.js"></script>
</body>
</html>
